<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MegaChud Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>MegaChud</h1>
    <span class="subtitle">Phase 1 — Reliable Core · Phase 2 — Memory</span>
  </header>

  <main>
    <section class="panel" id="new-task-panel">
      <h2>New Task</h2>
      <form id="new-task-form">
        <label>Title <input type="text" id="task-title" required /></label>
        <label>Prompt <textarea id="task-prompt" rows="2" required></textarea></label>
        <label>
          Tool calls (JSON array of {"tool_name","args"})
          <textarea id="task-tool-calls" rows="4">[
  {"tool_name": "write_file", "args": {"path": "hello.txt", "content": "hi"}},
  {"tool_name": "read_file", "args": {"path": "hello.txt"}}
]</textarea>
        </label>
        <button type="submit">Run Task</button>
      </form>
      <p id="new-task-status"></p>
    </section>

    <section class="panel" id="working-summary-panel">
      <h2>Working Summary</h2>
      <div id="working-summary">Select a task to see its working summary.</div>
    </section>

    <section class="panel" id="approvals-panel">
      <h2>Pending Approvals</h2>
      <div id="approvals-list">No pending approvals.</div>
    </section>

    <section class="panel" id="activity-panel">
      <h2>Live Activity</h2>
      <div id="activity-feed"></div>
    </section>

    <section class="panel" id="tasks-panel">
      <h2>Task History</h2>
      <table id="tasks-table">
        <thead>
          <tr><th>Title</th><th>Status</th><th>Created</th><th>Completed</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel" id="memory-panel">
      <h2>Memory Browser</h2>
      <div class="memory-controls">
        <select id="memory-type-filter">
          <option value="">All types</option>
          <option value="episodic">Episodic</option>
          <option value="semantic">Semantic</option>
          <option value="user">User</option>
        </select>
        <input type="text" id="memory-search-box" placeholder="Search memory..." />
        <button id="memory-search-btn" type="button">Search</button>
        <button id="memory-list-btn" type="button">List recent</button>
        <button id="memory-reindex-btn" type="button">Reindex from vault</button>
      </div>
      <form id="new-memory-form">
        <label>Title <input type="text" id="memory-title" required /></label>
        <label>Content <textarea id="memory-content" rows="2" required></textarea></label>
        <label>Tags (comma separated) <input type="text" id="memory-tags" /></label>
        <button type="submit">Remember this</button>
      </form>
      <p id="memory-status"></p>
      <div id="memory-results"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
