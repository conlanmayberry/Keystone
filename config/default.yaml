workspace_root: "./workspace"
db_path: "./data/megachud.db"
vault_root: "./vault"

api:
  host: "127.0.0.1"
  port: 8000

approval:
  timeout_seconds: 3600
  poll_interval_seconds: 0.5

shell:
  # Real executables only — Windows cmd builtins (dir, type, etc.) can't run
  # under shell=False, which we require for safety (no metacharacter injection).
  allowlist: ["python", "pip", "pytest", "git"]
  denylist: ["rm", "del", "rd", "format", "shutdown", "git push", "git reset --hard", "git clean"]
  timeout_seconds: 120

evaluation:
  test_command: null

logging:
  level: "INFO"

memory:
  vector_dim: 512
  default_top_k: 5

curiosity:
  similarity_threshold: 0.35
  research_objective_top_k: 3

experiment:
  default_minimum_sample_size: 10

bottleneck:
  window_days: 7
  min_samples: 5
  tool_failure_rate_threshold: 0.2

# Illustrative placeholder numbers, NOT real provider pricing — no LLM call
# exists anywhere in this codebase yet (see routing/engine.py). These exist
# so ConfiguredModelRouter has something concrete to route between.
model_routing:
  default_quality_target: 2
  profiles:
    - name: "fast-cheap"
      cost_per_1k_input_tokens: 0.0002
      cost_per_1k_output_tokens: 0.0006
      quality_tier: 1
      est_latency_ms: 400
    - name: "balanced"
      cost_per_1k_input_tokens: 0.001
      cost_per_1k_output_tokens: 0.003
      quality_tier: 2
      est_latency_ms: 900
    - name: "premium"
      cost_per_1k_input_tokens: 0.005
      cost_per_1k_output_tokens: 0.015
      quality_tier: 3
      est_latency_ms: 1800
