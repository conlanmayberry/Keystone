workspace_root: "./workspace"
db_path: "./data/megachud.db"

api:
  host: "127.0.0.1"
  port: 8000

approval:
  timeout_seconds: 3600
  poll_interval_seconds: 0.5

shell:
  # Real executables only — Windows cmd builtins (dir, type, etc.) can't run
  # under shell=False, which we require for safety (no metacharacter injection).
  allowlist: ["python", "pip", "pytest", "git"]
  denylist: ["rm", "del", "rd", "format", "shutdown", "git push", "git reset --hard", "git clean"]
  timeout_seconds: 120

evaluation:
  test_command: null

logging:
  level: "INFO"
