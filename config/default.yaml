workspace_root: "./workspace"
db_path: "./data/megachud.db"
vault_root: "./vault"
# Phase 5 structural multi-agent/multi-project seam — see models/agent.py
# and db.py::get_or_create_agent. Still exactly one orchestrator process;
# these just tag rows for a future multi-agent phase to build on.
agent_name: "default"
project_name: "default"

api:
  host: "127.0.0.1"
  port: 8000

approval:
  timeout_seconds: 3600
  poll_interval_seconds: 0.5

shell:
  # Real executables only — Windows cmd builtins (dir, type, etc.) can't run
  # under shell=False, which we require for safety (no metacharacter injection).
  allowlist: ["python", "pip", "pytest", "git"]
  denylist: ["rm", "del", "rd", "format", "shutdown", "git push", "git reset --hard", "git clean"]
  timeout_seconds: 120

evaluation:
  test_command: null

logging:
  level: "INFO"

memory:
  vector_dim: 512
  default_top_k: 5

curiosity:
  similarity_threshold: 0.35
  research_objective_top_k: 3

experiment:
  default_minimum_sample_size: 10

bottleneck:
  window_days: 7
  min_samples: 5
  tool_failure_rate_threshold: 0.2

# `name` is the literal, directly-callable Claude model ID — RoutingDecision.chosen_model
# feeds straight into llm/client.py's `model` argument with no mapping table.
# Pricing below is approximate, sourced when this was written — verify/adjust
# against current published Anthropic pricing before relying on it for real
# cost accounting. Sonnet 5 may have introductory pricing that undercuts this.
model_routing:
  default_quality_target: 2
  profiles:
    - name: "claude-haiku-4-5-20251001"
      cost_per_1k_input_tokens: 0.001
      cost_per_1k_output_tokens: 0.005
      quality_tier: 1
      est_latency_ms: 500
    - name: "claude-sonnet-5"
      cost_per_1k_input_tokens: 0.003
      cost_per_1k_output_tokens: 0.015
      quality_tier: 2
      est_latency_ms: 1200
    - name: "claude-opus-4-8"
      cost_per_1k_input_tokens: 0.005
      cost_per_1k_output_tokens: 0.025
      quality_tier: 3
      est_latency_ms: 2500

review:
  hourly_window_hours: 1
  weekly_window_days: 7

# Nothing loads unless explicitly named here — a fresh clone loads zero
# plugins. See plugins/README.md for the full mechanism.
plugins:
  enabled_local: []
  enabled_packages: []
  active_reflection_generator: null
  active_model_router: null

# Which model each LLM-backed swap-point uses by default — policy knobs
# only. The actual API key is never here; it comes from ANTHROPIC_API_KEY
# in the real environment or .env (see config.py::Settings.load). With no
# key configured, every LLM-backed component falls back to its existing
# deterministic implementation — zero behavior change.
llm:
  default_reflection_model: "claude-haiku-4-5-20251001"
  default_planner_model: "claude-sonnet-5"
  default_curiosity_model: "claude-haiku-4-5-20251001"
  default_conversation_model: "claude-sonnet-5"
  default_prompt_drafter_model: "claude-haiku-4-5-20251001"
  reflection_max_tokens: 4096
  planner_max_tokens: 4096
  curiosity_max_tokens: 1024
  conversation_max_tokens: 4096
  prompt_drafter_max_tokens: 512
  timeout_seconds: 60.0

# http_fetch/download_file/web_search safety knobs. Empty allow/deny lists
# = unrestricted (any public domain permitted) — the SSRF/private-network
# guard in internet/url_safety.py always applies regardless and is not a
# feature toggle.
internet:
  domain_allowlist: []
  domain_denylist: []
  fetch:
    max_response_bytes: 2000000
    timeout_seconds: 15.0
    max_redirects: 5
  download:
    # Files land under workspace/downloads/ — browse them directly there.
    max_file_bytes: 25000000
    max_folder_bytes: 500000000
    blocked_extensions: [".exe", ".msi", ".bat", ".cmd", ".sh", ".ps1", ".dll", ".scr", ".com", ".jar"]
    timeout_seconds: 30.0
    max_redirects: 5
  search:
    max_results: 10
    timeout_seconds: 10.0
  browser:
    headless: true
    nav_timeout_ms: 15000
    max_sessions: 4
    viewport_width: 1280
    viewport_height: 800
    state_changing_button_text: ["buy", "purchase", "order", "pay", "checkout", "submit", "confirm", "delete", "remove", "send", "post", "subscribe"]

# Direct-LLM research notes written into vault_root. Set vault_root to
# your real Obsidian vault (config/local.yaml) to have these land in it
# with [[wikilinks]] to notes that already exist there. Outbound links
# only — MegaChud never edits a note it didn't write. With no
# ANTHROPIC_API_KEY, the write_research_note tool isn't registered and the
# auto-on-completion hook never runs; nothing else changes.
research:
  enabled: true
  folder: "research"
  auto_on_task_completion: true
  model: "claude-sonnet-5"
  max_tokens: 4096
  link_candidates: 12
  excerpt_chars: 400
  max_notes_scanned: 2000
  # Hand-written notes describing how the agent should work, loaded into
  # the synthesis prompt. Edit them in Obsidian to change behavior — no
  # restart, no code change. MUST differ from `folder` above: the agent
  # reads instructions from here, so it must not be able to write here.
  guidance_folder: "guidance"
  # ~3k tokens added to every synthesis call. Notes are ordered by an
  # `order:` frontmatter integer and dropped WHOLE from the end when the
  # budget runs out, so `order:` decides what survives.
  guidance_max_chars: 12000
  guidance_max_notes: 20

# The live "thoughts" feed is an ephemeral in-memory ring buffer — capped
# so old entries fall off and nothing is stored permanently (lost on
# restart, by design).
runtime:
  thought_max_entries: 50
  thought_max_chars: 400
